$kind: http-request
url: "{{baseUrl}}/api/v1/login"
method: POST
headers:
  Accept: application/json
  Origin: http://localhost:5173
  Referer: http://localhost:5173
  X-Dev-Csrf-Bypass: postman-dev-secret
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "customer@example.com",
      "password": "password"
    }
order: 3000
