$kind: http-request
url: "{{baseUrl}}/api/v1/cart"
method: GET
headers:
  Accept: application/json
  Origin: http://localhost:5173
  Referer: http://localhost:5173
scripts:
  - type: afterResponse
    code: |-
      const first = pm.response.json()?.data?.items?.[0];
      if (first) pm.globals.set("cart_item_id", String(first.id));
      console.log("cart_item_id:", first?.id);
    language: text/javascript
order: 9100
